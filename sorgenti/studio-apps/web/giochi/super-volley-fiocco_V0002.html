<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141d3d">
<title>Super Volley Fiocco — V0002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--arena:#141d3d;--arena2:#1f2c5c;--floor:#d9772b;--led:#ffb627;--chalk:#f6f1e7;--net:#e8ecf5;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--arena);color:var(--chalk);font-family:var(--body);
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;display:grid;align-content:center;justify-content:center;
  grid-template-areas:"stage stage" "L R";grid-template-columns:auto auto;column-gap:0}
body.land #app{grid-template-areas:"L stage R";grid-template-columns:var(--side,110px) auto var(--side,110px);align-items:center}
#stage{position:relative;grid-area:stage;justify-self:center}
#cv{display:block;width:100%;height:100%;touch-action:none;border-radius:6px}
.tb{position:absolute;top:6px;width:40px;height:40px;border-radius:10px;border:1.5px solid rgba(246,241,231,.45);
  background:rgba(20,29,61,.7);color:var(--chalk);font:700 16px var(--body);cursor:pointer;display:none;align-items:center;justify-content:center}
body.playing .tb{display:flex}
#bPause{right:6px} #bReset{left:6px}
.padrow{display:contents}
.pad{display:flex;gap:12px;align-items:center;justify-content:center;padding:14px 12px;visibility:hidden}
body.playing .pad{visibility:visible}
#padL{grid-area:L;justify-self:start} #padR{grid-area:R;justify-self:end}
body.land #padL{flex-direction:column;justify-self:center} body.land #padR{justify-self:center}
.pb{touch-action:none;border:none;cursor:pointer;color:var(--arena);font-family:var(--display);-webkit-user-select:none;user-select:none}
.dir{width:76px;height:76px;border-radius:18px;background:var(--chalk);font-size:28px;box-shadow:0 5px 0 #9aa3b8}
.dir.on,.dir:active{transform:translateY(3px);box-shadow:0 2px 0 #9aa3b8}
#bAct{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ffe39b,var(--led) 58%,#b87400);font-size:17px;box-shadow:0 6px 0 #7a4d00}
#bAct.on,#bAct:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4d00}
body.land .dir{width:72px;height:72px} body.land #bAct{width:100px;height:100px}
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;
  padding:22px;text-align:center;background:rgba(14,20,44,.94);overflow-y:auto}
.ov[hidden]{display:none}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1}
h1{font-size:clamp(40px,11vw,72px);color:var(--led);text-shadow:0 4px 0 #8a3d0d}
h1 small{display:block;font-size:.42em;color:var(--chalk);text-shadow:none;margin-top:8px}
h2{font-size:clamp(26px,7vw,40px);color:var(--led)}
h3{font-size:15px;color:var(--chalk);margin-top:6px}
.lead{margin:0;max-width:34ch;font-size:16px;line-height:1.4;color:#d9dcea}
.cta{min-height:52px;min-width:220px;border-radius:14px;border:none;cursor:pointer;font:400 18px var(--display);color:var(--arena);
  background:var(--led);box-shadow:0 5px 0 #8a5a00;padding:0 22px}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5a00}
.ghost{min-height:46px;min-width:200px;border-radius:12px;border:1.5px solid rgba(246,241,231,.5);background:transparent;color:var(--chalk);font:600 16px var(--body);cursor:pointer;padding:0 18px}
button:focus-visible{outline:3px solid var(--led);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:420px}
.team{border:2px solid rgba(246,241,231,.18);border-radius:12px;background:rgba(255,255,255,.04);color:var(--chalk);padding:8px 4px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font:600 13px var(--body)}
.team.on{border-color:var(--led);background:rgba(255,182,39,.14)}
.team:disabled{opacity:.28;cursor:not-allowed}
.kit{position:relative;width:34px;height:38px}
.kit i{position:absolute;left:3px;top:0;width:28px;height:22px;border-radius:5px 5px 2px 2px;border:1.5px solid rgba(0,0,0,.35)}
.kit b{position:absolute;left:6px;top:23px;width:22px;height:13px;border-radius:2px 2px 4px 4px;border:1.5px solid rgba(0,0,0,.35)}
.seg{display:flex;gap:6px}
.seg button{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid rgba(246,241,231,.3);background:transparent;color:var(--chalk);font:600 14px var(--body);cursor:pointer}
.seg button.on{background:var(--chalk);color:var(--arena)}
.ver{position:absolute;right:12px;bottom:10px;margin:0;font-size:12px;opacity:.55}
.big{font-family:var(--display);font-size:46px;color:var(--chalk)}
.sets{font-size:15px;color:#d9dcea;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (orientation:landscape) and (max-height:520px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));max-width:720px}}
</style>
</head>
<body>
<div id="app">
  <div class="padrow" id="padRow">
    <div class="pad" id="padL"><button class="pb dir" id="bLeft" aria-label="Sinistra">◀</button><button class="pb dir" id="bRight" aria-label="Destra">▶</button></div>
  </div>
  <div id="stage">
    <canvas id="cv" aria-label="Campo di pallavolo"></canvas>
    <button class="tb" id="bReset" aria-label="Ricomincia la partita">↺</button>
    <button class="tb" id="bPause" aria-label="Pausa">II</button>
  </div>
  <div class="padrow" id="padRow2">
    <div class="pad" id="padR"><button class="pb" id="bAct" aria-label="Azione: battuta, salto, schiacciata, muro">Azione</button></div>
  </div>

  <section id="sTitle" class="ov">
    <h1>Super Volley<small>Fiocco</small></h1>
    <p class="lead">Pallavolo arcade quattro contro quattro. Muovi il giocatore con le frecce e premi Azione per battere, schiacciare e murare.</p>
    <button class="cta" id="bGo">Gioca</button>
    <button class="ghost" id="bAudio">Audio attivo</button>
    <p class="ver">V0002</p>
  </section>

  <section id="sSelect" class="ov" hidden>
    <h2>Scegli le squadre</h2>
    <h3>La tua squadra</h3><div class="grid" id="gMy"></div>
    <h3>Avversario</h3><div class="grid" id="gOpp"></div>
    <h3>Difficoltà</h3>
    <div class="seg" id="segDiff"><button data-d="0">Facile</button><button data-d="1" class="on">Normale</button><button data-d="2">Campione</button></div>
    <button class="cta" id="bStart">Inizia la partita</button>
  </section>

  <section id="sPause" class="ov" hidden>
    <h2>In pausa</h2>
    <button class="cta" id="bResume">Riprendi</button>
    <button class="ghost" id="bRestart">Ricomincia la partita</button>
    <button class="ghost" id="bTeams1">Cambia squadre</button>
    <button class="ghost" id="bHome">Torna al titolo</button>
  </section>

  <section id="sSet" class="ov" hidden>
    <h2 id="setTitle">Fine del 1° set</h2>
    <div class="big" id="setScore">15 - 12</div>
    <p class="sets" id="setSets"></p>
    <button class="cta" id="bNextSet">Continua</button>
  </section>

  <section id="sEnd" class="ov" hidden>
    <h2 id="endTitle">Vittoria!</h2>
    <div class="big" id="endSets">2 - 1</div>
    <p class="sets" id="endDetail"></p>
    <button class="cta" id="bRematch">Rivincita</button>
    <button class="ghost" id="bTeams2">Cambia squadre</button>
  </section>
</div>

<script>
'use strict';
/* ═══ F01 · CORE ═══════════════════════════════════════════ */
const VERSION = 'V0002';
const W = 640, H = 360, DT = 1 / 60;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, String(v)); } catch (e) {} }
};
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
function rngf(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = rngf(1989);

const Sys = { update: [], draw: [] };
function addSys(list, prio, fn){ Sys[list].push({ prio, fn }); Sys[list].sort((a, b) => a.prio - b.prio); }
const Hooks = { sfx(){}, unlock(){} };
window.__SV = window.__SV || {};

const TEAMS = [
  { id: 'ITA', name: 'Italia',   shirt: '#2f86d8', shorts: '#2f86d8' },
  { id: 'BRA', name: 'Brasile',  shirt: '#f5d313', shorts: '#1f3fa8' },
  { id: 'NED', name: 'Olanda',   shirt: '#e2342b', shorts: '#e2342b' },
  { id: 'CUB', name: 'Cuba',     shirt: '#161616', shorts: '#d4252b' },
  { id: 'JPN', name: 'Giappone', shirt: '#f4f4f4', shorts: '#d4252b' },
  { id: 'RUS', name: 'Russia',   shirt: '#d4252b', shorts: '#1f3fa8' }
];
const G = { state: 'title', tick: 0, stateT: 0, acc: 0, last: 0, dpr: 1, scale: 1,
  my: 0, opp: 1, diff: 1, cpuBoth: false, seed: 1989 };

const TRANSITIONS = { title: ['select'], select: ['play', 'title'], play: ['pause', 'setend', 'matchend'],
  pause: ['play', 'title', 'select'], setend: ['play'], matchend: ['play', 'select', 'title'] };
const SCREENS = { title: 'sTitle', select: 'sSelect', pause: 'sPause', setend: 'sSet', matchend: 'sEnd' };
function setState(s){
  if (!TRANSITIONS[G.state] || TRANSITIONS[G.state].indexOf(s) < 0) return false;
  G.state = s; G.stateT = 0; showScreens(); return true;
}
function showScreens(){
  for (const k in SCREENS) $(SCREENS[k]).hidden = G.state !== k;
  document.body.classList.toggle('playing', G.state === 'play');
  if (G.state === 'select') paintSelect();
}

/* Layout: verticale = campo sopra e comandi sotto; orizzontale = comandi ai lati */
function layout(){
  const vw = window.innerWidth || W, vh = window.innerHeight || 640;
  const land = vw > vh;
  document.body.classList.toggle('land', land);
  let s;
  if (land){ const side = clamp(Math.floor(vw * 0.15), 92, 130); document.body.style.setProperty('--side', side + 'px'); s = Math.min((vw - side * 2 - 16) / W, (vh - 8) / H); }
  else s = Math.min((vw - 8) / W, (vh - 200) / H, 1.6);
  G.scale = s > 0 ? s : 1;
  G.dpr = Math.min(2, window.devicePixelRatio || 1);
  G.zoom = land ? 1.3 : 1.6; G.hz = land ? 1 : 1.3;
  const st = $('stage'); st.style.width = Math.round(W * G.scale) + 'px'; st.style.height = Math.round(H * G.scale) + 'px';
  cv.width = Math.round(W * G.scale * G.dpr); cv.height = Math.round(H * G.scale * G.dpr);
  bgDirty = true;
}

/* Loop a passo fisso */
function step(){
  G.tick++; G.stateT++;
  for (const s of Sys.update) s.fn();
}
function frame(ts){
  G.raf = requestAnimationFrame(frame);
  if (!G.last) G.last = ts;
  let dt = (ts - G.last) / 1000; G.last = ts;
  if (dt > 0.25) dt = 0.25; if (dt < 0) dt = 0;
  if (G.state === 'play'){
    G.acc += dt * (FX.slow ? 0.35 : 1); let n = 0;
    while (G.acc >= DT && n < 5 && G.state === 'play'){ step(); G.acc -= DT; n++; }
    if (n >= 5) G.acc = 0;
  } else G.acc = 0;
  render();
}
function render(){
  const k = G.scale * G.dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  for (const s of Sys.draw) s.fn(ctx);
}

/* Arena: sfondo pre-disegnato (pubblico, cartelloni, pavimento) */
const FLOOR_Y = 300, PX = 30, X0 = 50;
const sx = m => X0 + m * PX, sy = h => FLOOR_Y - h * PX;
const bgCv = document.createElement('canvas'), bgc = bgCv.getContext('2d');
G.camX = W / 2; G.zoom = 1; G.hz = 1;
/* ═══ V0002 · EFFETTI SPETTACOLO ═══ */
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const FX = { shake: 0, flash: 0, banner: null, slow: false, party: null };
Hooks.buzz = ms => { try { if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
function fxHit(power){ if (!REDUCED) FX.shake = Math.max(FX.shake, 0.28 * power); FX.flash = Math.max(FX.flash, (REDUCED ? 0.04 : 0.12) * power); }
function camRect(){ const z = G.zoom || 1; return { z, L: clamp(G.camX - W / (2 * z), 0, W - W / z), T: H - H / z }; }
function worldT(c){ const v = camRect(), k = G.scale * G.dpr * v.z; let ox = 0, oy = 0;
  if (FX.shake > 0){ const a = FX.shake * 14 * k; ox = (Math.random() - 0.5) * a; oy = (Math.random() - 0.5) * a; }
  c.setTransform(k, 0, 0, k, -v.L * k + ox, -v.T * k + oy); }
function hudT(c, bottom){ const k = G.scale * G.dpr, z = G.hz || 1; c.setTransform(k * z, 0, 0, k * z, (W * k - W * k * z) / 2, bottom ? H * k - H * k * z : 0); }
let bgDirty = true;
function paintBG(){
  const k = G.scale * G.dpr * (G.zoom || 1); bgCv.width = Math.round(W * k); bgCv.height = Math.round(H * k);
  const c = bgc; c.setTransform(k, 0, 0, k, 0, 0);
  const r = rngf(77);
  const g1 = c.createLinearGradient(0, 0, 0, FLOOR_Y); g1.addColorStop(0, '#0e1530'); g1.addColorStop(1, '#253366');
  c.fillStyle = g1; c.fillRect(0, 0, W, FLOOR_Y);
  for (let i = 0; i < 6; i++){ c.fillStyle = 'rgba(255,240,200,' + (0.06 + 0.04 * (i % 2)) + ')'; c.beginPath(); c.ellipse(60 + i * 104, 70, 26, 10, 0, 0, Math.PI * 2); c.fill(); }
  const cols = ['#e2342b','#2f86d8','#f5d313','#f4f4f4','#1f3fa8','#d9772b','#8bc34a','#f06292'];
  for (let row = 0; row < 7; row++){
    const y = 96 + row * 18;
    for (let x = 4 + (row % 2) * 7; x < W; x += 14){
      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x - 5, y + 4, 10, 10);
      c.fillStyle = cols[(r() * cols.length) | 0]; c.globalAlpha = 0.55 + r() * 0.3; c.fillRect(x - 4, y + 5, 8, 8);
      c.fillStyle = '#e8c39e'; c.globalAlpha = 0.75; c.beginPath(); c.arc(x, y, 3.6, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
    }
  }
  c.fillStyle = '#0e1530'; c.fillRect(0, 226, W, 40);
  const ads = ['Fiocco', 'AICOMTEC', 'Fiocco', 'Volley', 'Fiocco'];
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = "15px 'Bungee', Impact, sans-serif";
  ads.forEach((t, i) => { const x = 8 + i * 126; c.fillStyle = i % 2 ? '#f6f1e7' : '#ffb627'; c.fillRect(x, 232, 118, 28); c.fillStyle = '#141d3d'; c.fillText(t, x + 59, 247); });
  c.fillStyle = '#2b6d4a'; c.fillRect(0, 266, W, FLOOR_Y - 266);
  const g2 = c.createLinearGradient(0, FLOOR_Y, 0, H); g2.addColorStop(0, '#b45a1c'); g2.addColorStop(1, '#5b2a0b');
  c.fillStyle = g2; c.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
  c.fillStyle = '#d9772b'; c.fillRect(sx(0), FLOOR_Y, sx(18) - sx(0), 7);
  c.fillStyle = '#f6f1e7'; c.fillRect(sx(0) - 1, FLOOR_Y, 3, 7); c.fillRect(sx(18) - 2, FLOOR_Y, 3, 7); c.fillRect(sx(6) - 1, FLOOR_Y, 2, 7); c.fillRect(sx(12) - 1, FLOOR_Y, 2, 7);
  bgDirty = false;
}
addSys('draw', 0, c => {
  if (bgDirty) paintBG();
  const v = camRect(), k = G.scale * G.dpr * v.z;
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(bgCv, -v.L * k, -v.T * k); c.restore();
});

/* ═══ F02 · INPUT ══════════════════════════════════════════ */
const IN = { left: false, right: false, act: false, pressed: false, released: false, holdT: 0, ids: { bLeft: new Set(), bRight: new Set(), bAct: new Set() }, keys: {} };
function syncIn(){
  const k = IN.keys;
  IN.left = IN.ids.bLeft.size > 0 || !!(k.ArrowLeft || k.KeyA);
  IN.right = IN.ids.bRight.size > 0 || !!(k.ArrowRight || k.KeyD);
  const act = IN.ids.bAct.size > 0 || !!(k.Space || k.Enter || k.KeyK);
  if (act && !IN.act) IN.pressed = true;
  if (!act && IN.act) IN.released = true;
  IN.act = act;
  ['bLeft', 'bRight', 'bAct'].forEach(id => $(id).classList.toggle('on', IN.ids[id].size > 0));
}
['bLeft', 'bRight', 'bAct'].forEach(id => {
  const el = $(id), set = IN.ids[id];
  el.addEventListener('pointerdown', e => { e.preventDefault(); set.add(e.pointerId); try { el.setPointerCapture(e.pointerId); } catch (_) {} Hooks.unlock(); syncIn(); });
  const up = e => { if (set.delete(e.pointerId)) syncIn(); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
});
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape'){ if (G.state === 'play') pause(); else if (G.state === 'pause') resume(); return; }
  IN.keys[e.code] = true; syncIn();
});
document.addEventListener('keyup', e => { IN.keys[e.code] = false; syncIn(); });
function consumePress(){ const p = IN.pressed; IN.pressed = false; return p; }
function consumeRelease(){ const r = IN.released; IN.released = false; return r; }
function clearInput(){ for (const k in IN.ids) IN.ids[k].clear(); IN.keys = {}; IN.act = IN.left = IN.right = false; IN.pressed = IN.released = false; IN.holdT = 0; syncIn(); }

/* ═══ SCHERMATE ════════════════════════════════════════════ */
function paintSelect(){
  const mk = (gid, sel, dis, cb) => {
    const g = $(gid); g.innerHTML = '';
    TEAMS.forEach((t, i) => {
      const b = document.createElement('button'); b.className = 'team' + (i === sel ? ' on' : ''); b.disabled = i === dis;
      b.setAttribute('aria-pressed', i === sel ? 'true' : 'false');
      b.innerHTML = '<span class="kit"><i style="background:' + t.shirt + '"></i><b style="background:' + t.shorts + '"></b></span>' + t.name;
      b.addEventListener('click', () => cb(i)); g.appendChild(b);
    });
  };
  mk('gMy', G.my, -1, i => { G.my = i; if (G.opp === i) G.opp = (i + 1 + Math.floor(rnd() * 5)) % 6; store.set('svf_my', i); paintSelect(); });
  mk('gOpp', G.opp, G.my, i => { if (i !== G.my){ G.opp = i; paintSelect(); } });
  document.querySelectorAll('#segDiff button').forEach(b => b.classList.toggle('on', +b.dataset.d === G.diff));
}
document.querySelectorAll('#segDiff button').forEach(b => b.addEventListener('click', () => { G.diff = +b.dataset.d; store.set('svf_diff', G.diff); paintSelect(); }));
function pause(){ if (G.state === 'play'){ clearInput(); return setState('pause'); } return false; }
function resume(){ if (G.state !== 'pause') return false; G.last = 0; G.acc = 0; clearInput(); return setState('play'); }
const Match = { start(){}, nextSet(){} };   // implementati nelle fasi successive
function startMatch(seed){
  if (['select', 'pause', 'matchend'].indexOf(G.state) < 0) return false;
  if (G.my === G.opp) G.opp = (G.my + 1) % 6;
  G.seed = (seed !== undefined) ? (seed >>> 0) : ((Date.now() ^ 0x5f3) >>> 0);
  rnd = rngf(G.seed); clearInput();
  setState('play'); Match.start(); return true;
}

/* ═══ F03 · FISICA PALLA E CAMPO ═══════════════════════════ */
const NETX = 9, NETH = 2.43, BR = 0.11, GB = 8.5, GP = 12, JUMPV = 4.65, SPEED = 4.2;
const H_DIG = 0.9, H_SET = 2.2, H_ATK = 3.05, H_FREE = 1.6, REACH_TOP = 2.35;
const SET_U = 7.0, ATK_U = 8.15;
const DIFF = [
  { name: 'Facile',   cpuSpike: 0.74, cpuDig: 0.72, cpuBlock: 0.14, cpuServeErr: 0.09, assist: 1.0, win: 0.30, humanDig: 0.72 },
  { name: 'Normale',  cpuSpike: 0.82, cpuDig: 0.80, cpuBlock: 0.22, cpuServeErr: 0.06, assist: 0.6, win: 0.15, humanDig: 0.60 },
  { name: 'Campione', cpuSpike: 0.90, cpuDig: 0.86, cpuBlock: 0.30, cpuServeErr: 0.04, assist: 0.0, win: 0.05, humanDig: 0.55 }
];
const ball = { x: 0, y: 0, vx: 0, vy: 0 };
const toX = (t, u) => t === 0 ? u : 18 - u;

const NUMS = [[4, 7, 10, 12], [3, 6, 9, 11]];

const FORM = { serve: [-0.6, 3.0, 5.2, 7.7], recv: [1.6, 3.4, 5.3, 7.6], def: [2.2, 4.0, 6.0, 8.55], off: [2.4, 4.4] };

/* ═══ F05 · MECCANICA DELL'AZIONE ══════════════════════════ */
const R = { phase: 'serve', touches: [0, 0], lastTeam: -1, lastPlayer: null, kind: '', expect: null, attacker: [null, null],

function say(t){ G.comm = { text: t, t: 170 }; }

function newRally(){

  R.attacker = [null, null]; R.setter = null; R.plan = ''; R.blockPlan = false; R.blocker = null; R.blockChecked = true;
  R.liveT = 0; R.serveT = 0; R.charging = false; R.chargeT = 0; R.netHit = false; R.backRow = false;

function pressureTeam(){ for (const t of [0, 1]){ const a = M.score[t], b = M.score[1 - t]; if (a >= M.setPts - 1 && a - b >= 1) return t; } return -1; }
function serve(power){

  const x0 = srv.x, y0 = 2.7;
  R.phase = 'live'; R.kind = 'serve'; R.lastTeam = s; R.lastPlayer = srv; R.touches = [0, 0]; R.liveT = 0;

function cpuServePower(){ return rnd() < D().cpuServeErr ? (rnd() < 0.5 ? 0.02 : 1) : 0.25 + rnd() * 0.65; }

function computeExpect(){

  }

    pl = pool.reduce((a, b) => Math.abs(b.x - xh) < Math.abs(a.x - xh) ? b : a);
    if (next === 'dig' && isHuman(S) && ctrl && ctrl.team === 0 && Math.abs(ctrl.x - xh) - Math.abs(pl.x - xh) < 0.7) pl = ctrl;
  }
  let can = true;

}
function blockerOf(t){ return rot[t].reduce((a, b) => toU(t, b.x) > toU(t, a.x) ? b : a); }

function contact(p, type, q){

  R.touches[T]++;

function gapTarget(o){

}
function planAttack(T){

function tryBlock(prevX){

function scoreLanding(x){

/* ═══ F06 · MOVIMENTO, IA, CONTROLLO UMANO ═════════════════ */
function moveTo(p, x, spd){ const d = x - p.x, m = spd * DT; p.x += Math.abs(d) <= m ? d : Math.sign(d) * m; }
function clampSide(p){ if (p.team === 0) p.x = clamp(p.x, -1.2, NETX - 0.3); else p.x = clamp(p.x, NETX + 0.3, 19.2); }
function aiTarget(p){
  const E = R.expect, t = p.team, slot = rot[t].indexOf(p);
  if (R.phase !== 'live') return null;
  if (E && E.player === p && E.team === t) return E.x;
  const own = E && E.team === t;
  if (own && p === R.attacker[t]) return E.next === 'spike' ? E.x : toX(t, 6.8);
  if (own) return toX(t, FORM.off[Math.min(1, slot % 2)]);
  if (p === blockerOf(t) && E && E.next === 'spike') return toX(t, 8.55);
  return toX(t, FORM.def[slot]);
}
function updatePlayers(){
  const E = R.expect, d = D();
  for (const t of [0, 1]) for (const p of rot[t]){
    if (p.animT > 0) p.animT -= DT; else p.anim = '';
    if (p.y > 0 || p.vy > 0){ p.vy -= GP * DT; p.y += p.vy * DT; if (p.y <= 0){ p.y = 0; p.vy = 0; } }
    const human = isHuman(t) && p === ctrl;
    if (human && (IN.left || IN.right) && p.y === 0){ moveTo(p, p.x + (IN.right ? 1 : -1), SPEED * 1.08); clampSide(p); continue; }
    const tx = aiTarget(p);
    if (tx === null) continue;
    let spd = SPEED;
    if (human){
      const isAtk = E && E.next === 'spike' && E.team === 0 && p === R.attacker[0];
      const isRecv = E && E.team === 0 && E.player === p && E.next === 'dig';
      if (isRecv) spd = SPEED * d.assist; else if (!isAtk && !(E && E.team === 0 && E.player === p)) spd = SPEED * 0.5;
    }

    if (p.y === 0 && spd > 0) moveTo(p, tx, spd);
    clampSide(p);
  }
}
function cpuJumps(){
  const E = R.expect; if (!E || E.next !== 'spike') return;
  const tA = timeToH(H_ATK);

  const A = E.player, T = E.team;
  if (!isHuman(T) && A){
    if (R.plan === 'spike' && tA <= 0.40) jump(A, 'spike');
    if (R.plan === 'error' && tA <= 0.12) jump(A, 'spike');
  }
  const B = R.blocker;
  if (B && R.blockPlan && !isHuman(B.team) && tA <= 0.36) jump(B, 'block');
}
function humanActions(){
  if (!isHuman(0)) return;
  const pr = consumePress(), rl = consumeRelease();
  if (R.phase === 'serve' && M.serving === 0){
    if (pr){ R.charging = true; R.chargeT = 0; }
    if (R.charging){ R.chargeT += DT; if (rl || R.chargeT > 1.7){ R.charging = false; serve(Math.min(1, R.chargeT / 1.1)); } }
    return;
  }

  else if (E && E.team === 1 && E.next === 'spike') { const b = blockerOf(0); ctrl = b; jump(b, 'block'); }

}
function checkContacts(prevY){
  const E = R.expect; if (!E) return;
  const p = E.player, d = D();
  if (E.next === 'spike'){
    const top = REACH_TOP + p.y, win = isHuman(p.team) ? d.win : 0.1;
    if (p.y > 0.05 && Math.abs(p.x - ball.x) <= 0.8 + win && ball.y >= top - 0.55 - win && ball.y <= top + 0.25){
      if (p.y < 0.4){ contact(p, 'free', 0.3); if (isHuman(p.team)) say('Salto fuori tempo: palla appoggiata'); return; }
      let dir, q, err = false;
      if (isHuman(p.team)){
        q = clamp(p.y / 0.9, 0.3, 1);
        const fw = p.team === 0 ? IN.right : IN.left, bw = p.team === 0 ? IN.left : IN.right;
        dir = fw ? 'deep' : (bw ? 'tip' : 'mid');
      } else { q = 0.9; dir = R.planDir; err = R.plan === 'error'; }
      if (isHuman(p.team)) Hooks.buzz(25);

      return;

    E.missed = true;

    E.dived = true;

    const dr = E.fast ? 0.95 : 1.25;

function ballStep(){
  const px = ball.x, py = ball.y;

  R.liveT += DT;
