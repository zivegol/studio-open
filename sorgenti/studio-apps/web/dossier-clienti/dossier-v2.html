<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dossier Cliente</title>
<style>:root{--b:#00457c;--bg:#f3f6f8;--line:#d8e2e9;--muted:#5d7180;--ok:#267447;--warn:#a76500}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#172b3a}header{background:var(--b);color:#fff;padding:18px 24px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;opacity:.85}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;max-width:1450px;margin:18px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.list{max-height:75vh;overflow:auto}.client{padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.client:hover{background:#eaf5fb}.client.archived{opacity:.62;background:#f4f4f4}.client small{display:block;color:var(--muted);margin-top:3px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}.checkline{display:flex;gap:8px;align-items:center;margin:2px 0 12px;font-size:13px;color:var(--muted)}.checkline input{width:auto;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.fact{border:1px solid var(--line);border-radius:10px;padding:11px}.fact label{font-size:12px;color:var(--muted);display:block}.fact strong{font-size:16px}.badge{display:inline-block;font-size:11px;border-radius:20px;padding:3px 7px;background:#eef2f4;margin-top:5px}.verified,.current_document{color:var(--ok)}.candidate{color:var(--warn)}.missing,.review_required{color:#9d3030}.section{margin-top:20px}.section h2{font-size:17px;margin-bottom:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}.actions button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#e8eef2;color:#17364b}.actions button.archive{background:#7b3030;color:white}.actions button.restore{background:#267447;color:white}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.note{color:var(--muted);font-size:13px}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{max-height:35vh}}</style>
<script src="../studio-core/storage.js?v=20260816-gateway2"></script></head>
<body><header><h1>Dossier Cliente</h1><p>Anagrafica, documenti, bilanci e sintesi fiscale verificata.</p></header>
<main class="layout"><aside class="card"><input id="search" placeholder="Cerca cliente"><label class="checkline"><input id="showArchived" type="checkbox"> Mostra soggetti archiviati</label><div id="meta"></div><div id="clients" class="list"></div></aside><section id="detail" class="card"><p>Seleziona un cliente.</p></section></main>
<script>
let clients=[],clientFlags={};const INDEX_PATH='Studio/DossierClienti/private/dossier-index.json',FLAGS_PATH='Studio/DossierClienti/private/client-flags.json';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
const model=v=>({pf:'Redditi PF',sp:'Redditi SP',sc:'Redditi SC'}[v]||v);
const labels={ricavi:'Ricavi',componentiPositivi:'Componenti positivi',componentiNegativi:'Componenti negativi',redditoDichiarato:'Reddito dichiarato',redditoComplessivo:'Reddito complessivo',oneriDeducibili:'Oneri deducibili',redditoImponibile:'Reddito imponibile',impostaLorda:'Imposta lorda',detrazioniImposta:'Detrazioni',impostaNetta:'Imposta netta',impostaDebito:'Imposta a debito',addizionaleRegionaleDebito:'Addizionale regionale',addizionaleComunaleDebito:'Addizionale comunale',ricaviCompensi:'Ricavi/compensi',coefficienteRedditivita:'Coefficiente redditività',redditoLordo:'Reddito lordo',contributiPrevidenziali:'Contributi previdenziali',redditoNetto:'Reddito netto',redditoImponibileSostitutiva:'Imponibile sostitutiva',aliquotaImpostaSostitutiva:'Aliquota sostitutiva',impostaSostitutiva:'Imposta sostitutiva',acconti:'Acconti',credito:'Credito',compensiProfessionali:'Compensi professionali',speseProfessionali:'Spese professionali',redditoProfessionale:'Reddito professionale',utileCivilistico:'Utile civilistico',variazioniAumento:'Variazioni in aumento',variazioniDiminuzione:'Variazioni in diminuzione',redditoFiscale:'Reddito fiscale',imponibileIres:'Imponibile IRES',iresLorda:'IRES lorda',iresNetta:'IRES netta',ritenute:'Ritenute',creditoIres:'Credito IRES'};
const formatFiscal=(key,v)=>key.toLowerCase().includes('coefficiente')||key.toLowerCase().includes('aliquota')?`${esc(v)}%`:money(v);
async function init(){try{const [r,fr]=await Promise.all([fetch('dossier-data.php',{credentials:'same-origin',headers:{Accept:'application/json'}}),StudioStorage.request(FLAGS_PATH,{method:'GET',headers:{Accept:'application/json'}})]);if(!r.ok){let message='HTTP '+r.status;try{message=(await r.json()).error||message}catch{}throw Error(message)}const d=await r.json();clients=d.clients;if(fr.ok)clientFlags=await fr.json();const u=d.summary.unico2025||{},archived=Object.values(clientFlags).filter(x=>x?.archived).length;document.getElementById('meta').innerHTML=`<small>${d.summary.clients} soggetti · ${archived} archiviati · ${d.summary.withBilanci} con bilanci · ${d.summary.withVisura} con visure · ${d.summary.withUnico2025||0} con Redditi 2025<br>Estrazioni fiscali: ${u.fiscalVerified||0} verificate · ${u.fiscalReviewRequired||0} da completare<br>Aggiornato ${new Date(d.generatedAt).toLocaleString('it-IT')}</small>`;renderList()}catch(e){document.getElementById('detail').innerHTML='<p class="missing">'+esc(e.message)+'</p>'}}
function isArchived(id){return Boolean(clientFlags[id]?.archived)}
function renderList(){const q=document.getElementById('search').value.toLowerCase(),showArchived=document.getElementById('showArchived').checked;document.getElementById('clients').innerHTML=clients.filter(c=>c.identity.displayName.toLowerCase().includes(q)&&(showArchived||!isArchived(c.clientId))).map(c=>{const current=(c.obligations||[]).filter(o=>o.isCurrent),archived=isArchived(c.clientId);return `<div class="client ${archived?'archived':''}" onclick="openClient('${c.clientId}')"><strong>${esc(c.identity.displayName)}</strong>${archived?'<span class="badge">archiviato</span>':''}<small>${esc(c.facts.formaGiuridica.value||'forma da verificare')} · ${c.bilanci.length} bilanci · ${current.length} dichiarazioni correnti</small></div>`}).join('')}
async function setArchived(id,archived){const c=clients.find(x=>x.clientId===id);if(!c)return;clientFlags[id]={archived,displayName:c.identity.displayName,updatedAt:new Date().toISOString()};const r=await StudioStorage.request(FLAGS_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(clientFlags,null,2)});if(!r.ok)throw Error('Salvataggio archivio non riuscito: HTTP '+r.status);renderList();openClient(id)}
function fact(label,f){if(!f||f.status==='not_applicable')return '';let value=f.value??'Non disponibile';if(Array.isArray(f.value)){value=f.value.length?f.value.map(v=>{if(typeof v!=='object')return String(v);if(label==='Amministratori')return `${v.name||'—'} — ${v.role||'ruolo non indicato'}`;if(label==='Compagine sociale')return `${v.name||'—'} — ${v.percentage||'—'}%${v.right?` (${v.right})`:''}`;return Object.values(v).filter(x=>x!==null&&x!==undefined).join(' — ')}).join('\n'):'Non disponibile'}return `<div class="fact"><label>${label==='Legale rappresentante'?'Legale rappresentante (titolare)':label}</label><strong style="white-space:pre-line">${esc(value)}</strong><br><span class="badge ${f.status}">${esc(f.status)}</span></div>`}
function fiscalSummary(o){const x=o.fiscalExtraction;if(!x||x.status!=='verified')return `<p class="review_required">Estrazione fiscale non ancora verificata.</p>`;return `<p><strong>Regime:</strong> ${esc(x.regime.replaceAll('_',' '))} · <span class="badge verified">verificato</span></p><div class="grid">${Object.entries(x.facts||{}).filter(([k])=>labels[k]).map(([k,f])=>`<div class="fact"><label>${esc(labels[k])} · ${esc(f.row)} · pag. ${esc(f.page)}</label><strong>${formatFiscal(k,f.value)}</strong></div>`).join('')}</div>`}
function openClient(id){const c=clients.find(x=>x.clientId===id);if(!c)return;const f=c.facts,visure=c.sources.filter(s=>s.kind==='visura'),all=c.obligations||[],current=all.filter(o=>o.isCurrent),history=all.filter(o=>!o.isCurrent),archived=isArchived(id);document.getElementById('detail').innerHTML=`<h1>${esc(c.identity.displayName)}</h1><p>ID dossier ${esc(c.dossierId)} · classificazione ${esc(c.classification)} ${archived?'· <span class="badge">soggetto archiviato</span>':''}</p><div class="actions"><button class="${archived?'restore':'archive'}" onclick="setArchived('${c.clientId}',${archived?'false':'true'}).catch(e=>alert(e.message))">${archived?'Ripristina soggetto':'Non cliente · archivia'}</button></div><div class="grid">${fact('Forma giuridica',f.formaGiuridica)}${fact('ATECO',f.ateco)}${fact('Dipendenti',f.dipendenti)}${fact('Legale rappresentante',f.legaleRappresentante)}${fact('Sistema di amministrazione',f.sistemaAmministrazione)}${fact('Amministratori',f.amministratori)}${fact('Compagine sociale',f.compagineSociale)}${fact('Data ultima visura',f.dataUltimaVisura)}</div><div class="section"><h2>Sintesi fiscale corrente</h2>${current.length?current.map(o=>`<div class="card"><h3>${esc(model(o.type.replace('redditi_','')))} · periodo d'imposta ${esc(o.taxYear)}</h3><p>${esc(o.declarationDate||'data non disponibile')} · ${esc(o.variant)} · ${esc(o.displayName)}</p>${o.dateSource==='file_mtime_fallback'?'<p class="note">Data ricavata dal file: da verificare.</p>':''}${fiscalSummary(o)}</div>`).join(''):'<p>Nessuna dichiarazione corrente associata.</p>'}</div><div class="section"><h2>Storico dichiarazioni</h2>${history.length?`<table><thead><tr><th>Data</th><th>Modello</th><th>Tipo</th><th>Documento</th></tr></thead><tbody>${history.sort((a,b)=>(b.declarationDate||'').localeCompare(a.declarationDate||'')).map(o=>`<tr><td>${esc(o.declarationDate||'—')}</td><td>${esc(model(o.type.replace('redditi_','')))}</td><td>${esc(o.variant)}</td><td>${esc(o.displayName)}</td></tr>`).join('')}</tbody></table>`:'<p>Nessuna dichiarazione precedente.</p>'}</div><div class="section"><h2>Visure associate</h2>${visure.length?`<table><tbody>${visure.map(v=>`<tr><td>${esc(v.displayName)}</td><td>${esc(v.visuraDate||'da verificare')}</td></tr>`).join('')}</tbody></table>`:'<p>Nessuna visura associata.</p>'}</div><div class="section"><h2>Bilanci disponibili</h2>${c.bilanci.length?`<table><thead><tr><th>Anno</th><th>Ricavi</th><th>Risultato</th><th>Dipendenti</th></tr></thead><tbody>${c.bilanci.map(b=>`<tr><td>${b.year}</td><td>${money(b.revenues)}</td><td>${money(b.result)}</td><td>${b.employees??'—'}</td></tr>`).join('')}</tbody></table>`:'<p>Nessun bilancio associato.</p>'}</div>`}
document.getElementById('search').addEventListener('input',renderList);document.getElementById('showArchived').addEventListener('change',renderList);init();
</script></body></html>
