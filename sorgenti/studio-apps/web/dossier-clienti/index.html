<body><header class="app-topbar"><div class="brand"><div class="brand-mark">DC</div><div><h1>Dossier Cliente</h1><p>Anagrafica, documenti, bilanci e fiscalità</p></div></div><div class="topbar-status">Area riservata dello Studio</div></header>
<main class="layout"><aside class="card client-panel"><div class="panel-eyebrow">Archivio clienti</div><h2>Seleziona il dossier</h2><p class="panel-help">Il dettaglio viene caricato soltanto dopo la selezione.</p><label for="clientSelect"><strong>Cliente</strong></label><select id="clientSelect"><option value="">Seleziona un cliente…</option></select><label class="checkline"><input id="showArchived" type="checkbox"> Mostra soggetti archiviati</label><div id="meta"></div></aside><section id="detail" class="detail-panel"><div class="empty-state"><div><div class="state-icon">⌂</div><div class="state-title">Nessun cliente selezionato</div><div>Scegli un cliente dal menu per aprire il dossier.</div></div></div></section></main>
<script>
const uiState={clients:[],clientFlags:{},archiveClientId:null};
Object.defineProperties(globalThis,{clients:{configurable:true,get:()=>uiState.clients,set:value=>{uiState.clients=value}},clientFlags:{configurable:true,get:()=>uiState.clientFlags,set:value=>{uiState.clientFlags=value}},archiveClientId:{configurable:true,get:()=>uiState.archiveClientId,set:value=>{uiState.archiveClientId=value}}});
const INDEX_PATH='Studio/DossierClienti/private/dossier-index.json',LIST_PATH='Studio/DossierClienti/private/dossier-client-list.json',FLAGS_PATH='Studio/DossierClienti/private/client-flags.json';
const HTML_ESCAPE_CHARS=Object.freeze({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'});
const escapeHtmlText=value=>String(value??'').replace(/[&<>"']/g,char=>HTML_ESCAPE_CHARS[char]);
const esc=escapeHtmlText;
const INTEGER_FORMATTER=new Intl.NumberFormat('it-IT',{maximumFractionDigits:0,useGrouping:'always'});
const formatInteger=value=>value==null?'—':INTEGER_FORMATTER.format(value);
const money=formatInteger;
const balanceNumber=formatInteger;
const MODEL_LABELS=Object.freeze({pf:'Redditi PF',sp:'Redditi SP',sc:'Redditi SC'});
const model=value=>MODEL_LABELS[value]||value;
const labels={ricavi:'Ricavi',componentiPositivi:'Componenti positivi',componentiNegativi:'Componenti negativi',redditoDichiarato:'Reddito dichiarato',redditoComplessivo:'Reddito complessivo',deduzioneAbitazionePrincipale:'Deduzione abitazione principale',oneriDeducibili:'Oneri deducibili',redditoImponibile:'Reddito imponibile',impostaLorda:'Imposta lorda',detrazioniImposta:'Detrazioni',impostaNetta:'Imposta netta',differenzaImposta:'Differenza d’imposta',impostaDebito:'Imposta a debito',impostaCredito:'Imposta a credito',addizionaleRegionaleDebito:'Addizionale regionale a debito',addizionaleRegionaleCredito:'Addizionale regionale a credito',addizionaleComunaleDebito:'Addizionale comunale a debito',addizionaleComunaleCredito:'Addizionale comunale a credito',redditoRiferimentoAgevolazioni:'Reddito di riferimento per agevolazioni',ricaviCompensi:'Ricavi/compensi',coefficienteRedditivita:'Coefficiente redditività',redditoLordo:'Reddito lordo',contributiPrevidenziali:'Contributi previdenziali',redditoNetto:'Reddito netto',redditoImponibileSostitutiva:'Imponibile sostitutiva',aliquotaImpostaSostitutiva:'Aliquota sostitutiva',impostaSostitutiva:'Imposta sostitutiva',acconti:'Acconti',credito:'Credito',compensiProfessionali:'Compensi professionali',speseProfessionali:'Spese professionali',redditoProfessionale:'Reddito professionale',utileCivilistico:'Utile civilistico',variazioniAumento:'Variazioni in aumento',variazioniDiminuzione:'Variazioni in diminuzione',redditoFiscale:'Reddito fiscale',imponibileIres:'Imponibile IRES',iresLorda:'IRES lorda',iresNetta:'IRES netta',ritenute:'Ritenute',creditoIres:'Credito IRES'};
const STATUS_BADGES=Object.freeze({verified:{label:'Verificato',tone:'success'},extracted:{label:'Dati estratti',tone:'success'},current_document:{label:'Documento corrente',tone:'success'},candidate:{label:'Dato da verificare',tone:'warning'},review_required:{label:'Da verificare',tone:'warning'},pending_extraction:{label:'Estrazione in corso',tone:'warning'},missing:{label:'Mancante',tone:'danger'},ambiguous:{label:'Ambiguo',tone:'danger'},error:{label:'Errore',tone:'danger'},archived:{label:'Archiviato',tone:'neutral'},document_only:{label:'Solo documento',tone:'neutral'},available:{label:'Disponibile',tone:'neutral'}});
function statusBadge(status,labelOverride=''){const item=STATUS_BADGES[status]||{label:String(status||'Stato non indicato').replaceAll('_',' '),tone:'neutral'};return `<span class="badge" data-status="${esc(status||'unknown')}" data-tone="${item.tone}">${esc(labelOverride||item.label)}</span>`}
const statePanel=(className,iconHtml,titleHtml,messageHtml)=>`<div class="${className}"><div>${iconHtml}<div class="state-title">${titleHtml}</div><div>${messageHtml}</div></div></div>`;
const emptyState=(title='Nessun dato disponibile',message='Non risultano elementi da mostrare.')=>statePanel('empty-state','<div class="state-icon">○</div>',esc(title),esc(message));
const loadingState=(message='Caricamento in corso…')=>statePanel('loading-state','<div class="loading-dot"></div>',esc(message),'Attendere qualche istante.');
const errorState=message=>statePanel('error-state','<div class="state-icon">!</div>','Impossibile caricare i dati',esc(message));
async function init(){try{document.getElementById('detail').innerHTML=loadingState('Caricamento elenco clienti…');const [lr,fr]=await Promise.all([StudioStorage.request(LIST_PATH,{method:'GET',headers:{Accept:'application/json'}}),StudioStorage.request(FLAGS_PATH,{method:'GET',headers:{Accept:'application/json'}})]);const r=lr.ok?lr:await StudioStorage.request(INDEX_PATH,{method:'GET',headers:{Accept:'application/json'}});if(!r.ok)throw Error(r.status===404?'Indice Dossier non disponibile':'HTTP '+r.status);const d=await r.json();clients=d.clients||[];if(fr.ok)clientFlags=await fr.json();const u=d.summary.unico2025||{},archived=Object.values(clientFlags).filter(x=>x?.archived).length;document.getElementById('meta').innerHTML=`<small>${d.summary.clients} soggetti · ${archived} archiviati · ${d.summary.withBilanci} con bilanci · ${d.summary.withVisura} con visure · ${d.summary.withUnico2025||0} con Redditi 2025<br>Estrazioni fiscali: ${u.fiscalVerified||0} verificate · ${u.fiscalReviewRequired||0} da completare<br>Aggiornato ${new Date(d.generatedAt).toLocaleString('it-IT')}</small>`;renderList();document.getElementById('detail').innerHTML=emptyState('Nessun cliente selezionato','Scegli un cliente dal menu per aprire il dossier.')}catch(e){document.getElementById('detail').innerHTML=errorState(e.message)}}
async function loadAndOpenClient(id){if(!id){document.getElementById('detail').innerHTML=emptyState('Nessun cliente selezionato','Scegli un cliente dal menu per aprire il dossier.');return}const current=clients.find(x=>x.clientId===id);if(!current)return;if(current._summaryOnly){document.getElementById('detail').innerHTML=loadingState('Caricamento dossier cliente…');const r=await StudioStorage.request(INDEX_PATH,{method:'GET',headers:{Accept:'application/json'}});if(!r.ok)throw Error(r.status===404?'Indice Dossier non disponibile':'HTTP '+r.status);const d=await r.json();clients=d.clients||[];renderList();document.getElementById('clientSelect').value=id}if(document.getElementById('clientSelect').value===id)openClient(id)}
function isArchived(id){return Boolean(clientFlags[id]?.archived)}
function renderList(){const select=document.getElementById('clientSelect'),selected=select.value,showArchived=document.getElementById('showArchived').checked,visible=clients.filter(c=>showArchived||!isArchived(c.clientId)).sort((a,b)=>a.identity.displayName.localeCompare(b.identity.displayName,'it',{sensitivity:'base'}));select.innerHTML='<option value="">Seleziona un cliente…</option>'+visible.map(c=>`<option value="${esc(c.clientId)}">${esc(c.identity.displayName)}${isArchived(c.clientId)?' · archiviato':''}</option>`).join('');if(visible.some(c=>c.clientId===selected))select.value=selected;else if(selected)document.getElementById('detail').innerHTML='<p>Seleziona un cliente dal menu.</p>'}
async function setArchived(id,archived){const c=clients.find(x=>x.clientId===id);if(!c)return;clientFlags[id]={archived,displayName:c.identity.displayName,updatedAt:new Date().toISOString()};const r=await StudioStorage.request(FLAGS_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(clientFlags,null,2)});if(!r.ok)throw Error('Salvataggio archivio non riuscito: HTTP '+r.status);renderList();openClient(id)}
function decodeEntities(value){const area=document.createElement('textarea');area.innerHTML=String(value);return area.value}
function fact(label,f){if(!f||f.status==='not_applicable')return '';let raw=f.value??'Non disponibile';const governance=label==='Amministratori'||label==='Compagine sociale';if(governance&&typeof raw==='string'){let text=decodeEntities(raw).trim();if(text.startsWith('{')||text.startsWith('[')){try{raw=JSON.parse(text)}catch{try{raw=JSON.parse('['+text+']')}catch{raw=text}}}}if(governance&&Array.isArray(raw)){const people=raw.length?raw.map(v=>{if(typeof v==='string'){let text=decodeEntities(v).trim();if(text.startsWith('{')||text.startsWith('[')){try{v=JSON.parse(text)}catch{}}}if(typeof v!=='object'||v===null)return `<div class="person-line"><strong>${esc(v)}</strong></div>`;const name=esc(v.name||'—');if(label==='Amministratori')return `<div class="person-line"><strong>${name}</strong><span class="person-meta">${esc(v.role||'ruolo non indicato')}</span></div>`;const percentage=v.percentage==null||v.percentage===''?'—':`${esc(v.percentage)}%`,right=v.right?String(v.right).replaceAll("'",'’'):'';return `<div class="person-line"><strong>${name} · ${percentage}</strong>${right?`<span class="person-meta">${esc(right)}</span>`:''}</div>`}).join(''):'<div class="person-line">Non disponibile</div>';return `<div class="fact"><label>${label}</label><div class="people-list">${people}</div>${statusBadge(f.status,f.status==='candidate'?'Dato da visura':'')}</div>`}let value=raw;if(Array.isArray(raw))value=raw.length?raw.map(v=>typeof v==='object'&&v!==null?Object.values(v).filter(x=>x!==null&&x!==undefined).join(' — '):String(v)).join('\n'):'Non disponibile';return `<div class="fact"><label>${label==='Legale rappresentante'?'Legale rappresentante (titolare)':label}</label><strong style="white-space:pre-line">${esc(value)}</strong><br>${statusBadge(f.status,f.status==='candidate'?'Dato da visura':'')}</div>`}
const documentNames={bilancio_cee:'Bilancio CEE',bilancio_xbrl:'Bilancio XBRL',bilancio_analitico:'Contabilità analitica',situazione_contabile:'Situazione contabile',verbale_bilancio:'Verbale bilancio',ricevuta_bilancio:'Ricevuta bilancio',redditi_sc:'Redditi SC',redditi_sp:'Redditi SP',redditi_pf:'Redditi PF',ricevuta_redditi:'Ricevuta Redditi',irap:'IRAP',iva:'Dichiarazione IVA','770':'Modello 770',cu:'Certificazione Unica',lipe:'LIPE',f24:'F24',intrastat:'Intrastat',visura:'Visura camerale',documento_identita:'Documento d’identità'};
const isMacroRow=r=>r.macro||/^[A-E]\)|^Totale |^Differenza |^Risultato prima|^Imposte sul|^Utile \(/.test(r.label||'');
function yearHeader(year,links){if(!links)return esc(year);if(typeof links==='string')return `<a href="${links}" target="_blank" rel="noopener" title="Apri il documento di riferimento">${esc(year)} ↗</a>`;return `<span>${esc(year)}</span><div class="year-docs">${links.map(x=>`<a href="${x.url}" target="_blank" rel="noopener" title="Apri ${esc(x.label)} ${esc(year)}">${esc(x.label)} ↗</a>`).join('')}</div>`}
function matrix(title,years,rows,yearLinks={},formatter=money){return `<div class="section"><h2>${esc(title)}</h2><div class="table-scroll matrix-scroll"><table class="numeric-matrix"><thead><tr><th>Voce</th>${years.map(y=>`<th>${yearHeader(y,yearLinks[y])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>r.group?`<tr><th colspan="${years.length+1}" style="background:#edf3f8;text-align:left">${esc(r.group)}</th></tr>`:`<tr class="${isMacroRow(r)?'macro-row':''}"><th>${esc(r.label)}</th>${years.map(y=>`<td>${r.values[y]==null?'—':formatter(r.values[y])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}

function visureDocumentsSection(c){const docs=(c.documentCatalog||[]).filter(d=>d.kind==='visura').sort((a,b)=>(Number(b.year)||0)-(Number(a.year)||0));if(!docs.length)return '';return `<div class="section"><h2>Visure camerali collegate</h2><div class="table-scroll"><table><thead><tr><th>Data/anno</th><th>Documento</th><th>Stato</th></tr></thead><tbody>${docs.map(d=>`<tr><td>${esc(d.year||'—')}</td><td><a href="${documentUrl(c,d)}" target="_blank" rel="noopener">${esc(d.displayName)} ↗</a></td><td>${statusBadge(d.dataStatus==='extracted'?'extracted':'review_required')}</td></tr>`).join('')}</tbody></table></div></div>`}
