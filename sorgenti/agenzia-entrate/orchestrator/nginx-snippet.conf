# Da aggiungere al server{} di cloud.studio.example: l'API risponde solo sotto lo stesso dominio
# di Nextcloud, così il browser invia il cookie di sessione e l'API riconosce l'utente.
location /cassetto-api/ {
    proxy_pass http://api:8080/api/;          # nome del servizio "api" sulla rete condivisa
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Requested-With $http_x_requested_with;
    proxy_read_timeout 30s;
}
