services:
  connector:
    image: studio-ade-connector:0.1
    container_name: studio-ade-connector
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=768m,mode=1777
    volumes:
      - secrets:/run/secrets:ro
    networks: [nextcloud]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  secrets:
    external: true
    name: studio-ade-secrets
networks:
  nextcloud:
    external: true
    name: nextcloud_default
